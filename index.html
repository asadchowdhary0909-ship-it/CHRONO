<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDS SCIENCE - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

    <div class="login-screen">

        <div class="welcome-card">

            <div class="logo">🔬</div>

            <h1>KIDS SCIENCE</h1>

            <p class="login-subtitle">
                Learn • Play • Discover
            </p>

            <input
                type="text"
                id="nameInput"
                maxlength="16"
                placeholder="Enter your nickname"
                autocomplete="off"
            >

            <button class="main-button" onclick="enterScienceWorld()">
                ENTER SCIENCE WORLD
            </button>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
